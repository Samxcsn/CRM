<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#1d2b2a;--mut:#667775;--line:#dbe3e1;--acc:#0f766e;--acc2:#e8f3f1}
@media(prefers-color-scheme:dark){:root{--bg:#121918;--card:#1a2423;--ink:#e6efed;--mut:#93a8a5;--line:#2b3a38;--acc:#2dd4bf;--acc2:#173431}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
nav{display:flex;gap:6px;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav b{margin-right:14px}nav a{color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:6px}nav a:hover{background:var(--acc2)}
nav .sp{flex:1}main{padding:20px;max-width:1400px;margin:auto}
h1{font-size:22px;margin:0 0 14px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
button{background:var(--acc);color:#fff;border:0;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}textarea,.grow{flex:1;min-width:140px}
.flash{background:var(--acc2);border:1px solid var(--acc);padding:8px 12px;border-radius:6px;margin-bottom:12px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}.col{min-width:210px;flex:1}
.col h2{display:flex;justify-content:space-between;color:var(--mut)}
.lead{display:block;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:6px;padding:9px 11px;margin-bottom:8px;color:inherit;text-decoration:none}
.lead small,.mut{color:var(--mut)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.chat{max-height:380px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.b{padding:7px 11px;border-radius:10px;max-width:80%;background:var(--bg)}.b.out{align-self:flex-end;background:var(--acc2)}
.b small{display:block;color:var(--mut);font-size:11px}ul.tl{list-style:none;padding:0;margin:0}ul.tl li{padding:6px 0;border-bottom:1px solid var(--line)}
.auth{max-width:360px;margin:8vh auto}.auth form{display:grid;gap:10px}
</style></head><body>
{% if current_user.is_authenticated %}<nav><b>CRM</b><a href="{{url_for('leads')}}">Leads</a><a href="{{url_for('vendas')}}">Vendas</a><a href="{{url_for('campanhas')}}">Campanhas</a><span class="sp"></span><span class="mut">{{current_user.name}}</span><a href="{{url_for('sair')}}">Sair</a></nav>{% endif %}
<main>{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block c %}{% endblock %}</main></body></html>
